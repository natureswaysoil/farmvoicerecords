name: Build

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Pinned: ubuntu-latest moved to Ubuntu 26 on 2026-10-19 and Playwright
    # 1.56 cannot install its browser dependencies there.
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
      NEXT_PUBLIC_SITE_URL: https://farmvoicerecords.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Test running application
        run: |
          npm run start -- -H 127.0.0.1 -p 3100 > /tmp/farmvoice-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ -o /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/farmvoice-next.log
              exit 1
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3100/ -o /dev/null; then
            cat /tmp/farmvoice-next.log
            exit 1
          fi
          SMOKE_BASE_URL=http://127.0.0.1:3100 npm run test:smoke || {
            cat /tmp/farmvoice-next.log
            exit 1
          }

